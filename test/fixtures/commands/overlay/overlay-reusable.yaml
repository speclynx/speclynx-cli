overlay: "1.2.0"
info:
  title: Reusable actions
  version: "1.0.0"
components:
  actions:
    addDescription:
      fields:
        description: Adds a description
        update:
          description: Added by reusable action
    markReviewed:
      fields:
        update:
          x-reviewed: true
actions:
